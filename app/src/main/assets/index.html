<script>
(function() {
  // If the API call has already been completed, set a global flag
  window.__API_DONE = localStorage.getItem('api_done') === '1';

  // Patch/fake the API call function to block further calls if offline
  // (You may need to adapt this to your actual API call logic)
  window.makeApiCall = function() {
    if (window.__API_DONE) {
      // Instead of making the API call, load from local storage/cache
      // You can trigger your local data load logic here
      if (window.loadFromLocalCache) {
        window.loadFromLocalCache();
      }
      return;
    }
    // Otherwise, make the real API call (replace with your actual logic)
    // After successful API call and data save, set the flag:
    // localStorage.setItem('api_done', '1');
    // window.__API_DONE = true;
  };

  // Example: When your JS receives the callback from Android after API call
  window.onApiCallComplete = function() {
    localStorage.setItem('api_done', '1');
    window.__API_DONE = true;
  };
})();
</script>

if (window.AndroidBackgroundProcessor) {
    window.AndroidBackgroundProcessor.onWebLoadingFinished(
        "1", // callbackId as string
        "loadingfinished", // type
        "" // data (empty string if not needed)
    );
}
